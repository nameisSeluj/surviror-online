<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survivor Duo</title>
<style>
:root{
  color-scheme:dark;
  --bg:#141210;
  --panel:#1e1a16;
  --panel-2:#28221c;
  --border:#463b30;
  --text:#f0e6d6;
  --muted:#9c8e7c;
  --gold:#e5a93c;
  --p1:#59b878;
  --p2:#5b8fd9;
  --danger:#d94e4e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#0e0c0a;
  color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",sans-serif;
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  touch-action:none;
  user-select:none;
}
.wrap{
  position:relative;
  width:min(100%,900px);
  aspect-ratio:800/560;
}
canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:8px;
  background:#1c1915;
  border:3px solid #3a3026;
  box-shadow:0 18px 50px rgba(0,0,0,.75);
}
#ov{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(12,10,8,.78);
  border-radius:8px;
  padding:14px;
  z-index:10;
}
.pn{
  width:min(100%,500px);
  max-height:100%;
  overflow:auto;
  background:var(--panel);
  border:2px solid var(--border);
  box-shadow:0 6px 0 #0d0b09, 0 20px 50px rgba(0,0,0,.7);
  border-radius:8px;
  padding:clamp(16px,3vw,26px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(10px,2vw,15px);
  text-align:center;
  animation:pop .18s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pn h2{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:.04em;
  text-transform:uppercase;
  font-size:clamp(1.4rem,4vw,2.1rem);
  color:var(--gold);
  text-shadow:0 2px 0 #0b0907;
}
.pn p{
  margin:0;
  color:var(--muted);
  font-size:clamp(.8rem,2vw,.92rem);
}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
button,input{
  font:inherit;
  border:2px solid var(--border);
  border-radius:6px;
  background:var(--panel-2);
  color:var(--text);
  padding:10px 16px;
}
button{
  cursor:pointer;
  font-weight:700;
  box-shadow:0 3px 0 #0d0b09;
  transition:transform .08s,border-color .1s,background .1s;
}
button:hover{border-color:var(--gold);background:#322b23}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #0d0b09}
input{
  width:min(100%,210px);
  text-transform:uppercase;
  text-align:center;
  letter-spacing:.18em;
  font-weight:700;
  background:#14110e;
}
input:focus{outline:none;border-color:var(--gold)}
#lk{text-transform:none;letter-spacing:0;font-size:.82rem;width:min(100%,290px);font-weight:400}
button.main{
  background:var(--gold);
  border-color:#f4c56a;
  color:#1a1308;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.05em;
  padding:11px 26px;
  font-size:.98rem;
  box-shadow:0 4px 0 #7a5212;
}
button.main:hover{background:#f0b548}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 #7a5212}
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;text-align:left}
.how div{
  background:#161310;
  border:1px solid #332a22;
  border-radius:6px;
  padding:8px 10px;
  font-size:clamp(.7rem,1.7vw,.8rem);
  color:#cbbba6;
  line-height:1.35;
}
.how b{color:var(--gold);text-transform:uppercase;font-size:.74rem;letter-spacing:.04em}
.slots{display:flex;gap:10px;width:100%}
.slot{
  flex:1;
  border-radius:6px;
  padding:10px;
  border:2px dashed var(--border);
  color:var(--muted);
  font-weight:700;
  font-size:.88rem;
}
.slot.on{border-style:solid;color:#111;border-color:rgba(0,0,0,.4)}
.stats{display:flex;gap:8px;width:100%}
.stats div{
  flex:1;
  background:#161310;
  border:1px solid #332a22;
  border-radius:6px;
  padding:10px 4px;
}
.stats b{display:block;font-family:Georgia,serif;font-size:clamp(1.1rem,3.4vw,1.65rem);color:var(--text)}
.stats small{color:var(--muted);font-size:.68rem;letter-spacing:.08em}
.pn .rec{color:var(--gold);font-weight:800;text-transform:uppercase;font-size:.82rem;letter-spacing:.05em}

/* Bouton Pause en jeu */
#pauseBtn{
  display:none;
  position:absolute;
  right:14px;
  bottom:12px;
  padding:6px 12px;
  font-size:.74rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  background:rgba(30,26,22,.9);
  border:2px solid var(--border);
  color:var(--text);
  z-index:6;
}
#pauseBtn:hover{border-color:var(--gold);color:var(--gold)}
@media (pointer:coarse){
  #pauseBtn{right:86px;bottom:24px}
}

/* Cartes d'amélioration centrées pendant la pause */
#pk{
  position:absolute;
  left:0;right:0;top:52%;
  transform:translateY(-20%);
  display:flex;gap:12px;justify-content:center;align-items:stretch;
  pointer-events:none;padding:0 18px;
  z-index:12;
}
#pk button{
  pointer-events:auto;
  flex:1;max-width:230px;
  text-align:left;
  display:flex;flex-direction:column;gap:6px;
  background:var(--panel);
  border:2px solid var(--gold);
  box-shadow:0 5px 0 #0b0907, 0 14px 30px rgba(0,0,0,.9);
  padding:14px 14px;
  font-size:clamp(.74rem,1.8vw,.88rem);
  position:relative;
}
#pk button:hover{background:#2d261e;transform:translateY(-3px)}
#pk b{color:var(--gold);font-size:.95rem}
#pk small{color:#cbbba6;font-weight:400;line-height:1.3}
#pk i{
  position:absolute;top:-11px;right:8px;
  background:var(--gold);color:#1a1308;
  border:1px solid #0b0907;
  border-radius:4px;font-style:normal;font-weight:900;font-size:.72rem;padding:2px 7px;
}
#pk span{
  align-self:center;background:var(--panel);border:2px solid var(--gold);
  padding:5px 9px;border-radius:4px;color:var(--gold);font-weight:800;font-size:.85rem;
}

/* Notifications */
#tt{position:absolute;top:22%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.t{
  padding:5px 14px;
  border-radius:4px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-size:clamp(.7rem,1.9vw,.84rem);
  background:#161310;
  border:2px solid currentColor;
  box-shadow:0 3px 0 #0a0807;
  animation:tt 2.1s forwards;
}
@keyframes tt{0%{opacity:0;transform:translateY(-6px)}10%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px)}}

#dash{
  display:none;position:absolute;right:14px;bottom:14px;
  width:64px;height:64px;border-radius:50%;
  background:var(--panel-2);border:2px solid var(--gold);color:var(--gold);
  font-size:.75rem;font-weight:900;letter-spacing:.05em;padding:0;touch-action:manipulation;
}
@media (pointer:coarse){#dash{display:block}}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="800" height="560"></canvas>
  <div id="pk"></div>
  <div id="tt"></div>
  <button id="pauseBtn" aria-label="Pause">Pause [P]</button>
  <button id="dash" aria-label="Esquive">DASH</button>
  <div id="ov"></div>
</div>
<script>
(function(){
var W=800,H=560,cv=document.getElementById("c"),ctx=cv.getContext("2d"),ov=document.getElementById("ov"),pk=document.getElementById("pk"),pauseBtn=document.getElementById("pauseBtn");
var best=0,ws,S=null,vis=[],keys={},ptr=null,PA=[],DEC=[],TR=[[],[]],tt=0,shake=0,lastHp=[],lastE=[],flashE={},BG=null,ovKey="",pkKey="",last=0,lastIn="",idle=0;
var FONT='"Trebuchet MS","Segoe UI",sans-serif',SERIF='Georgia,"Times New Roman",serif';
var CO=["#59b878","#5b8fd9"],CO_DARK=["#2b663f","#2c4f87"];
var EC=["#c94a4a","#d97b38","#7e52a0","#cbb042","#9e2a3b"],ER=[11,8,17,10,30];
var BOSS_COLS=["#9e2a3b","#c4492b","#3b7a9e","#7a3b9e","#b88628"];
var room=(new URLSearchParams(location.search).get("room")||"").toUpperCase();
var tq=document.getElementById("tt");

try{best=parseInt(localStorage.getItem("survivor-best"),10)||0}catch(e){}

function toast(m,c){
  var d=document.createElement("div");
  d.className="t";d.style.color=c;d.textContent=m;
  tq.appendChild(d);
  setTimeout(function(){d.remove()},2100);
}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}

function burst(x,y,c,n,leaveStain){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283,s=35+Math.random()*115;
    PA.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.28+Math.random()*.28,ml:.55,sz:2+Math.random()*3,c:c});
  }
  if(leaveStain){
    DEC.push({x:x+(Math.random()-.5)*8,y:y+(Math.random()-.5)*8,r:4+Math.random()*7,c:c,a:.26});
    if(DEC.length>140)DEC.shift();
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function mkBG(){
  BG=document.createElement("canvas");BG.width=W;BG.height=H;
  var g=BG.getContext("2d");
  g.fillStyle="#221e1a";g.fillRect(0,0,W,H);
  var ts=48;
  for(var y=0;y<H;y+=ts){
    for(var x=0;x<W;x+=ts){
      var v=((x*17+y*31)%11)-5;
      g.fillStyle="rgb("+(35+v)+","+(31+v)+","+(27+v)+")";
      g.fillRect(x+1,y+1,ts-2,ts-2);
      g.fillStyle="rgba(255,240,220,.03)";
      g.fillRect(x+2,y+2,ts-4,2);
    }
  }
  for(var i=0;i<1600;i++){
    var gx=Math.random()*W,gy=Math.random()*H;
    g.fillStyle=Math.random()>.5?"rgba(0,0,0,.18)":"rgba(255,235,210,.035)";
    g.fillRect(gx,gy,2,2);
  }
  g.strokeStyle="rgba(10,8,6,.45)";g.lineWidth=1.5;
  for(var c=0;c<18;c++){
    var cx=40+Math.random()*(W-80),cy=40+Math.random()*(H-80);
    g.beginPath();g.moveTo(cx,cy);
    for(var s=0;s<3;s++){cx+=(Math.random()-.5)*22;cy+=(Math.random()-.5)*22;g.lineTo(cx,cy)}
    g.stroke();
  }
  for(var m=0;m<24;m++){
    var mx=20+Math.random()*(W-40),my=20+Math.random()*(H-40);
    g.fillStyle="rgba(76,94,54,.24)";
    g.beginPath();g.arc(mx,my,3+Math.random()*5,0,6.283);g.fill();
  }
  var vg=g.createRadialGradient(W/2,H/2,W*.25,W/2,H/2,W*.68);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(8,6,5,.55)");
  g.fillStyle=vg;g.fillRect(0,0,W,H);
  g.strokeStyle="#120f0c";g.lineWidth=6;g.strokeRect(3,3,W-6,H-6);
  g.strokeStyle="#463b30";g.lineWidth=2;g.strokeRect(6,6,W-12,H-12);
}

/* ---------- Réseau & Menus ---------- */
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function setOv(key,html,fn){
  if(ovKey===key)return;ovKey=key;
  if(!html){ov.style.display="none";return}
  ov.style.display="flex";ov.innerHTML=html;if(fn)fn();
}
function how(){
  return '<div class="how">'+
    '<div><b>Déplacement</b><br>Flèches / ZQSD ou glisser</div>'+
    '<div><b>Esquive</b><br>Espace ou double-tap</div>'+
    '<div><b>Entraide</b><br>Rester près d’un allié à terre</div>'+
    '<div><b>Pause</b><br>Bouton en bas ou touche P / Échap</div>'+
  '</div>';
}
function lobby(msg){
  pauseBtn.style.display="none";
  setOv("L"+(msg||""),
    '<div class="pn"><h2>Survivor Duo</h2><p>Survivez aux vagues successives, seuls ou à deux.</p>'+how()+
    (msg?'<p style="color:#e5a93c;font-weight:700">'+msg+'</p>':'')+
    '<div class="row"><input id="rc" maxlength="6" placeholder="CODE" value="'+room+'"><button class="main" id="go">Entrer</button></div>'+
    '<p>Laisse vide pour générer un code de salle.</p></div>',
    function(){
      var go=document.getElementById("go");
      go.onclick=function(){
        room=(document.getElementById("rc").value||Math.random().toString(36).slice(2,6)).toUpperCase().replace(/[^A-Z0-9]/g,"");
        connect();
      };
      document.getElementById("rc").onkeydown=function(e){if(e.key==="Enter")go.click()};
    }
  );
}
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=function(){send({t:"join",room:room});history.replaceState(null,"","?room="+room)};
  ws.onmessage=function(e){
    var d=JSON.parse(e.data);
    if(d.t==="full"){ws.close();S=null;ovKey="";lobby("Salle complète, choisis un autre code.");return}
    onState(d);
  };
  ws.onclose=function(){if(S){S=null;ovKey="";lobby("Connexion interrompue.")}};
}
function onState(d){
  d.ev.forEach(function(v){
    burst(v[0],v[1],EC[v[2]],v[2]===4?45:9,true);
    if(v[2]===4)shake=11;
  });
  d.p.forEach(function(p,i){
    if(lastHp[i]!==undefined&&p[2]<lastHp[i]){
      if(i===d.me)shake=6;
      if(vis[i])burst(vis[i].x,vis[i].y,"#f0e6d6",7,false);
    }
    lastHp[i]=p[2];
  });
  d.E.forEach(function(e,idx){
    var key=e[2]+"_"+Math.round(e[0]/25)+"_"+Math.round(e[1]/25);
    if(lastE[idx]&&e[3]<lastE[idx][3])flashE[key]=.07;
  });
  lastE=d.E;

  var wasB=S&&S.E.some(function(e){return e[2]===4}),isB=d.E.some(function(e){return e[2]===4});
  if(S&&d.st==="play"){
    if(d.wv>S.wv){
      toast(d.wv%5===0?"Vague "+d.wv+" — Boss !":"Vague "+d.wv,d.wv%5===0?"#d94e4e":"#e5a93c");
    }
    if(wasB&&!isB)toast("Boss vaincu — Alliés relevés","#e5a93c");
    d.p.forEach(function(p,i){
      var o=S.p[i];if(!o)return;
      if(!o[4]&&p[4])toast((i===d.me?"Tu es":"J"+(i+1)+" est")+" à terre","#d94e4e");
      else if(o[4]&&!p[4]&&!(wasB&&!isB))toast("J"+(i+1)+" est sur pied","#59b878");
    });
    if(d.lk&&!S.lk)toast("Lien de garde actif","#e5a93c");
  }
  S=d;
  pauseBtn.style.display=d.st==="play"?"block":"none";

  if(d.st==="wait"){
    setOv("w"+d.n,
      '<div class="pn"><h2>Salle '+d.code+'</h2>'+
      '<div class="slots"><div class="slot on" style="background:'+CO[0]+'">J1 Prêt</div><div class="slot'+(d.n>1?' on" style="background:'+CO[1]+'">J2 Prêt':' ">En attente de J2…')+'</div></div>'+
      '<p>Partage ce lien pour jouer en coopération.</p>'+
      '<div class="row"><input id="lk" readonly value="'+location.origin+'/?room='+d.code+'"><button id="cp">Copier</button></div>'+
      '<button class="main" id="st">Lancer en solo</button></div>',
      function(){
        document.getElementById("cp").onclick=function(){
          var i=document.getElementById("lk");i.select();
          if(navigator.clipboard)navigator.clipboard.writeText(i.value);
          this.textContent="Copié";
        };
        document.getElementById("st").onclick=function(){send({t:"start"})};
      }
    );
  }else if(d.st==="over"){
    var rec=d.tm>best;
    if(rec){best=d.tm;try{localStorage.setItem("survivor-best",String(Math.floor(d.tm)))}catch(e){}}
    setOv("o",
      '<div class="pn"><h2>Défaite</h2>'+
      (rec?'<p class="rec">Nouveau record de survie</p>':'<p>Record : '+fmt(best)+'</p>')+
      '<div class="stats"><div><b>Vague '+d.wv+'</b><small>ATTEINTE</small></div><div><b>'+fmt(d.tm)+'</b><small>SURVIE</small></div><div><b>'+d.k+'</b><small>ÉLIMINÉS</small></div></div>'+
      '<button class="main" id="rs">Rejouer [Entrée]</button></div>',
      function(){document.getElementById("rs").onclick=function(){send({t:"restart"})}}
    );
  }else if(d.mpz){
    var by=d.pby===d.me?"toi":"J"+(d.pby+1);
    setOv("mpz_"+d.pby+"_"+d.wv+"_"+d.l,
      '<div class="pn"><h2>Jeu en pause</h2>'+
      '<p>Partie mise en pause par '+by+'.</p>'+
      '<div class="stats"><div><b>Vague '+d.wv+'</b><small>EN COURS</small></div><div><b>Niv. '+d.l+'</b><small>ÉQUIPE</small></div><div><b>'+fmt(d.tm)+'</b><small>TEMPS</small></div></div>'+
      '<button class="main" id="resume">Reprendre [P]</button></div>',
      function(){document.getElementById("resume").onclick=function(){send({t:"pause"})}}
    );
  }else setOv("p",null);

  var me=d.p[d.me];
  var kk=JSON.stringify(d.ch)+"|"+(me?me[7]:0);
  var keyBadges=["1 / &","2 / é","3 / \""];
  if(kk!==pkKey){
    pkKey=kk;
    if(d.ch&&d.ch.length){
      pk.style.display="flex";
      pk.innerHTML=d.ch.map(function(u,i){
        return '<button data-i="'+i+'"><i>'+keyBadges[i]+'</i><b>'+u[0]+'</b><small>'+u[1]+'</small></button>';
      }).join("")+(me&&me[7]>1?'<span>+'+(me[7]-1)+'</span>':'');
    }else{
      pk.innerHTML="";
      pk.style.display="none";
    }
  }
}
pk.onclick=function(e){var b=e.target.closest("button");if(b)send({t:"pick",i:+b.dataset.i})};
pauseBtn.onclick=function(){send({t:"pause"})};

/* ---------- Saisie (AZERTY & QWERTY) ---------- */
var pickMap={"Digit1":0,"Numpad1":0,"1":0,"&":0,"Digit2":1,"Numpad2":1,"2":1,"é":1,"Digit3":2,"Numpad3":2,"3":2,'"':2};
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="INPUT")return;
  keys[e.key]=1;
  if(e.key.indexOf("Arrow")===0||e.key===" ")e.preventDefault();
  if(S&&S.st==="play"&&(e.key==="p"||e.key==="P"||e.key==="Escape")){send({t:"pause"});return}
  var slot=pickMap[e.code]!==undefined?pickMap[e.code]:pickMap[e.key];
  if(S&&S.ch&&slot!==undefined)send({t:"pick",i:slot});
  if(e.key===" "||e.key==="Shift")send({t:"dash"});
  if(S&&S.st==="over"&&e.key==="Enter")send({t:"restart"});
});
document.addEventListener("keyup",function(e){keys[e.key]=0});
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
var lt=0;
cv.addEventListener("pointerdown",function(e){ptr=pos(e);var n=Date.now();if(n-lt<280)send({t:"dash"});lt=n});
window.addEventListener("pointermove",function(e){if(ptr)ptr=pos(e)});
window.addEventListener("pointerup",function(){ptr=null});
setInterval(function(){
  if(!S)return;
  var dx=0,dy=0;
  if(keys.ArrowLeft||keys.q||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;
  if(keys.ArrowUp||keys.z||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
  var v=vis[S.me];
  if(ptr&&v){var ex=ptr.x-v.x,ey=ptr.y-v.y,l=Math.hypot(ex,ey);if(l>10){dx=ex/l;dy=ey/l}}
  var k=dx+","+dy;
  if(k!==lastIn||++idle>10){lastIn=k;idle=0;send({t:"in",dx:dx,dy:dy})}
},33);

/* ---------- Dessin des personnages & ennemis ---------- */
function drawEnemy(e,a){
  var x=e[0],y=e[1],k=e[2],bk=e[4]||0;
  var r=k===4?(bk===4?35:(bk===3?34:(bk===1?26:30))):ER[k];
  var c=k===4?BOSS_COLS[bk]:EC[k];
  var key=k+"_"+Math.round(x/25)+"_"+Math.round(y/25);
  var hit=flashE[key]>0;
  var step=S&&S.pz?0:Math.sin(tt*(k===1?18:11)+x*.08);

  ctx.fillStyle="rgba(8,6,5,.48)";
  ctx.beginPath();ctx.ellipse(x,y+r*.85,r*.92,r*.36,0,0,6.283);ctx.fill();

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(1+step*.06,1-step*.06);

  if(k===2||k===4){
    ctx.fillStyle=hit?"#fff":(bk===4?"#e5a93c":"#2a1e1c");
    ctx.strokeStyle="#0d0a08";ctx.lineWidth=2;
    var spikes=k===4?(bk===4?14:(bk===1?6:10)):6;
    for(var i=0;i<spikes;i++){
      var an=i*(6.283/spikes)+(S&&S.pz?0:tt*(k===4?(bk===1?1.4:.6):0));
      ctx.beginPath();
      ctx.moveTo(Math.cos(an-.22)*r*.85,Math.sin(an-.22)*r*.85);
      ctx.lineTo(Math.cos(an)*r*1.38,Math.sin(an)*r*1.38);
      ctx.lineTo(Math.cos(an+.22)*r*.85,Math.sin(an+.22)*r*.85);
      ctx.closePath();ctx.fill();ctx.stroke();
    }
  }

  ctx.fillStyle=hit?"#fff":c;
  ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();

  if(!hit){
    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.beginPath();ctx.arc(0,r*.2,r*.88,0.1,Math.PI-0.1);ctx.fill();
  }

  ctx.strokeStyle="#120d0a";
  ctx.lineWidth=k===4?3.2:2.2;
  ctx.stroke();

  if(k===4&&!hit){
    ctx.strokeStyle=bk===4?"#ffd166":"rgba(0,0,0,.35)";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,r*.58,0,6.283);ctx.stroke();
  }

  if(!hit){
    for(var s=-1;s<=1;s+=2){
      var ex=Math.cos(a)*r*.38+Math.cos(a+1.57)*s*r*.35;
      var ey=Math.sin(a)*r*.38+Math.sin(a+1.57)*s*r*.35;
      ctx.fillStyle=k===4?"#ffd166":"#f5ebd6";
      ctx.beginPath();ctx.arc(ex,ey,r*.24,0,6.283);ctx.fill();
      ctx.fillStyle="#120d0a";
      ctx.beginPath();ctx.arc(ex+Math.cos(a)*r*.08,ey+Math.sin(a)*r*.08,r*.12,0,6.283);ctx.fill();
    }
  }
  ctx.restore();

  if(k===2){
    ctx.fillStyle="#120d0a";rr(x-r-1,y-r-14,r*2+2,6,2);ctx.fill();
    ctx.fillStyle="#d94e4e";
    rr(x-r,y-r-13,Math.max(2,r*2*e[3]/100),4,1);ctx.fill();
  }
}

function drawPlayer(p,i,v,aimAngle){
  var c=CO[i%2],cd=CO_DARK[i%2],T=TR[i];
  var bob=S&&S.pz?0:Math.sin(tt*12+i)*1.4;

  if(p[4]){
    ctx.strokeStyle="rgba(240,230,214,.25)";ctx.lineWidth=1.5;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.arc(v.x,v.y,60,0,6.283);ctx.stroke();ctx.setLineDash([]);

    ctx.strokeStyle="#120d0a";ctx.lineWidth=6;ctx.beginPath();ctx.arc(v.x,v.y,21,0,6.283);ctx.stroke();
    ctx.strokeStyle=c;ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(v.x,v.y,21,-1.57,-1.57+6.283*p[5]/2.2);ctx.stroke();

    ctx.fillStyle="#5c5349";ctx.strokeStyle="#120d0a";ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(v.x,v.y,10,0,6.283);ctx.fill();ctx.stroke();

    ctx.fillStyle="#f0e6d6";ctx.font="bold 11px "+FONT;ctx.textAlign="center";
    ctx.fillText("À TERRE",v.x,v.y-29);
    return;
  }

  if(i===S.me){
    ctx.strokeStyle="rgba(240,230,214,.09)";ctx.lineWidth=1;ctx.setLineDash([4,6]);
    ctx.beginPath();ctx.arc(v.x,v.y,p[8],0,6.283);ctx.stroke();ctx.setLineDash([]);
  }

  for(var k=0;k<T.length;k+=2){
    var f=k/T.length;
    ctx.fillStyle="rgba(20,17,14,"+(f*.28)+")";
    ctx.beginPath();ctx.arc(T[k].x,T[k].y,4*f,0,6.283);ctx.fill();
  }

  ctx.fillStyle="rgba(8,6,5,.5)";
  ctx.beginPath();ctx.ellipse(v.x,v.y+10,11,4.5,0,0,6.283);ctx.fill();

  ctx.globalAlpha=p[6]&&Math.floor(tt*20)%2?.35:1;

  ctx.save();
  ctx.translate(v.x,v.y+bob*.4);
  ctx.rotate(aimAngle);
  ctx.fillStyle="#4a423a";ctx.strokeStyle="#120d0a";ctx.lineWidth=2;
  rr(4,-3,13,6,2);ctx.fill();ctx.stroke();
  ctx.restore();

  ctx.fillStyle=c;
  ctx.beginPath();ctx.arc(v.x,v.y+bob*.4,11,0,6.283);ctx.fill();
  ctx.fillStyle=cd;
  ctx.beginPath();ctx.arc(v.x,v.y+2+bob*.4,9.5,0.2,Math.PI-0.2);ctx.fill();
  ctx.strokeStyle="#120d0a";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(v.x,v.y+bob*.4,11,0,6.283);ctx.stroke();

  var vx=v.x+Math.cos(aimAngle)*3.5,vy=v.y+bob*.4+Math.sin(aimAngle)*3.5;
  ctx.fillStyle="#f5ebd6";
  ctx.beginPath();ctx.arc(vx,vy,4.5,0,6.283);ctx.fill();
  ctx.strokeStyle="#120d0a";ctx.lineWidth=1.5;ctx.stroke();

  ctx.globalAlpha=1;

  if(p[10]){
    for(var q=0;q<p[10];q++){
      var oa=S.oa+q*6.283/p[10],bx=v.x+Math.cos(oa)*46,by=v.y+Math.sin(oa)*46;
      ctx.save();ctx.translate(bx,by);ctx.rotate(oa+1.57);
      ctx.fillStyle="#d8cfc0";ctx.strokeStyle="#120d0a";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(5,0);ctx.lineTo(0,8);ctx.lineTo(-5,0);ctx.closePath();
      ctx.fill();ctx.stroke();ctx.restore();
    }
  }

  ctx.fillStyle="#f0e6d6";ctx.font="bold 10px "+FONT;ctx.textAlign="center";
  ctx.fillText(i===S.me?"TOI":"J"+(i+1),v.x,v.y-18);
}

/* ---------- Rendu principal ---------- */
function draw(){
  tt=performance.now()/1000;
  if(!BG)mkBG();
  ctx.save();
  if(shake>0&&!(S&&S.pz))ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.drawImage(BG,0,0);

  DEC.forEach(function(d){
    ctx.globalAlpha=d.a;ctx.fillStyle=d.c;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.283);ctx.fill();
  });
  ctx.globalAlpha=1;

  if(S&&S.st!=="wait"){
    var pl=S.p;

    S.G.forEach(function(g){
      var y=g[1]+(S.pz?0:Math.sin(tt*4.5+g[0])*2);
      ctx.fillStyle="#3fa796";ctx.strokeStyle="#120d0a";ctx.lineWidth=1.8;
      ctx.beginPath();
      ctx.moveTo(g[0],y-7);ctx.lineTo(g[0]+5,y);ctx.lineTo(g[0],y+7);ctx.lineTo(g[0]-5,y);
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle="#9be8d8";
      ctx.beginPath();ctx.moveTo(g[0],y-5);ctx.lineTo(g[0]+2.5,y);ctx.lineTo(g[0],y);ctx.closePath();ctx.fill();
    });

    S.E.forEach(function(e){
      var a=0,nd=1e9;
      pl.forEach(function(p,j){
        if(p[4]||!vis[j])return;
        var d=(vis[j].x-e[0])**2+(vis[j].y-e[1])**2;
        if(d<nd){nd=d;a=Math.atan2(vis[j].y-e[1],vis[j].x-e[0])}
      });
      drawEnemy(e,a);
    });

    S.B.forEach(function(b){
      ctx.strokeStyle="#120d0a";ctx.lineWidth=5;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(b[0]-b[2]*.032,b[1]-b[3]*.032);ctx.lineTo(b[0],b[1]);ctx.stroke();
      ctx.strokeStyle=b[4]%2===0?"#f4c56a":"#9bc4ff";ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(b[0]-b[2]*.032,b[1]-b[3]*.032);ctx.lineTo(b[0],b[1]);ctx.stroke();
    });

    S.X.forEach(function(b){
      ctx.fillStyle="#d94e4e";ctx.strokeStyle="#120d0a";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b[0],b[1],4.5,0,6.283);ctx.fill();ctx.stroke();
    });

    if(S.lk&&pl.length>1&&vis[1]){
      ctx.strokeStyle="#120d0a";ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(vis[0].x,vis[0].y);ctx.lineTo(vis[1].x,vis[1].y);ctx.stroke();
      ctx.strokeStyle="#e5a93c";ctx.lineWidth=2;ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.moveTo(vis[0].x,vis[0].y);ctx.lineTo(vis[1].x,vis[1].y);ctx.stroke();
      ctx.setLineDash([]);
    }

    pl.forEach(function(p,i){
      var v=vis[i];if(!v)return;
      var aim=0,nd=1e9;
      S.E.forEach(function(e){
        var d=(e[0]-v.x)**2+(e[1]-v.y)**2;
        if(d<nd){nd=d;aim=Math.atan2(e[1]-v.y,e[0]-v.x)}
      });
      drawPlayer(p,i,v,aim);
    });

    PA.forEach(function(p){
      ctx.globalAlpha=Math.max(0,p.l/p.ml);
      ctx.fillStyle=p.c;
      ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
    });
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // HUD
  if(S&&S.st!=="wait"){
    var me=S.p[S.me];
    if(me&&me[6]&&!S.pz){
      ctx.strokeStyle="rgba(217,78,78,.55)";ctx.lineWidth=14;ctx.strokeRect(7,7,W-14,H-14);
    }

    ctx.fillStyle="#120d0a";ctx.fillRect(0,0,W,8);
    ctx.fillStyle="#3fa796";ctx.fillRect(0,0,W*Math.min(1,S.xp/S.nd),7);
    ctx.fillStyle="#120d0a";ctx.fillRect(0,7,W,1);

    S.p.forEach(function(p,i){
      var x=i?W-176:16,hp=Math.max(0,p[2]/p[3]);
      rr(x,18,160,18,4);ctx.fillStyle="#161310";ctx.fill();
      if(hp>0){
        rr(x+2,20,Math.max(4,156*hp),14,2);
        ctx.fillStyle=p[4]?"#5c5349":CO[i%2];ctx.fill();
      }
      rr(x,18,160,18,4);ctx.strokeStyle="#463b30";ctx.lineWidth=2;ctx.stroke();

      ctx.fillStyle="#f0e6d6";ctx.font="bold 11px "+FONT;ctx.textAlign="center";
      ctx.fillText((i===S.me?"TOI":"J"+(i+1))+(p[4]?" · À TERRE":"  "+Math.ceil(p[2])+"/"+p[3]),x+80,31);

      if(i===S.me){
        var rd=Math.max(0,1-p[9]/2.0);
        rr(x,40,160,7,3);ctx.fillStyle="#161310";ctx.fill();
        if(rd>0){
          rr(x+1,41,Math.max(4,158*rd),5,2);
          ctx.fillStyle=rd>=1?"#e5a93c":"#6e6254";ctx.fill();
        }
        rr(x,40,160,7,3);ctx.strokeStyle="#382f26";ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle=rd>=1?"#e5a93c":"#9c8e7c";ctx.font="bold 10px "+FONT;
        ctx.fillText(rd>=1?"ESQUIVE PRÊTE [ESPACE]":"RECHARGE…",x+80,58);
      }
    });

    ctx.fillStyle="#e5a93c";ctx.font="bold 22px "+SERIF;ctx.textAlign="center";
    ctx.fillText("VAGUE "+S.wv,W/2,34);
    ctx.fillStyle="#cbbba6";ctx.font="bold 12px "+FONT;
    var sub=S.rem>0?("Restants : "+S.rem+"  |  Niv. "+S.l):("Vague nettoyée  |  Niv. "+S.l);
    ctx.fillText(sub,W/2,52);

    if(S.bn){
      var bw=340,bx=(W-bw)/2,by=72;
      rr(bx,by,bw,16,4);ctx.fillStyle="#161310";ctx.fill();
      if(S.bh>0){
        rr(bx+2,by+2,Math.max(4,(bw-4)*S.bh/100),12,2);
        ctx.fillStyle="#d94e4e";ctx.fill();
      }
      rr(bx,by,bw,16,4);ctx.strokeStyle="#e5a93c";ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle="#f0e6d6";ctx.font="bold 10px "+FONT;ctx.textAlign="center";
      ctx.fillText(S.bn.toUpperCase()+" — "+S.bh+"%",W/2,by+12);
    }else if(S.lk){
      ctx.textAlign="center";ctx.font="bold 13px "+FONT;
      ctx.fillStyle="#e5a93c";ctx.fillText("LIEN DE GARDE ACTIF",W/2,72);
    }

    ctx.textAlign="left";ctx.fillStyle="rgba(240,230,214,.35)";ctx.font="11px "+FONT;
    ctx.fillText("SALLE "+S.code+" · "+fmt(S.tm),16,H-14);

    // Voile de pause lors de la montée de niveau (quand pas en pause manuelle)
    if(S.pz&&!S.mpz){
      ctx.fillStyle="rgba(10,8,6,.72)";
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#e5a93c";ctx.font="bold 26px "+SERIF;ctx.textAlign="center";
      ctx.fillText("PAUSE — NIVEAU "+S.l,W/2,H/2-68);
      ctx.fillStyle="#f0e6d6";ctx.font="bold 14px "+FONT;
      var who=(S.ch&&S.ch.length)
        ?"Choisis ton amélioration (1/& , 2/é , 3/\")"
        :"Tu as choisi ! En attente de ton allié…";
      ctx.fillText(who,W/2,H/2-40);
    }
  }
}

function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(!(S&&S.pz)){
    shake=Math.max(0,shake-dt*32);
    for(var k in flashE){flashE[k]-=dt;if(flashE[k]<=0)delete flashE[k]}
    PA.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});
    PA=PA.filter(function(p){return p.l>0});
  }
  if(S)S.p.forEach(function(p,i){
    if(!vis[i])vis[i]={x:p[0],y:p[1]};
    vis[i].x+=(p[0]-vis[i].x)*.5;
    vis[i].y+=(p[1]-vis[i].y)*.5;
    var T=TR[i];
    if(S.st==="play"&&!p[4]&&!S.pz){T.push({x:vis[i].x,y:vis[i].y});if(T.length>14)T.shift()}
    else if(p[4])T.length=0;
  });
  draw();
  requestAnimationFrame(frame);
}
document.getElementById("dash").addEventListener("pointerdown",function(e){e.preventDefault();send({t:"dash"})});
if(room)connect();else lobby();
requestAnimationFrame(function(n){last=n;frame(n)});
})();
</script>
