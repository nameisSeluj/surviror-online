<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survivor Squad</title>
<style>
:root{
  color-scheme:dark;
  --bg:#141210;
  --panel:#1e1a16;
  --panel-2:#28221c;
  --border:#463b30;
  --text:#f0e6d6;
  --muted:#9c8e7c;
  --gold:#e5a93c;
  --crimson:#e05656;
  --danger:#d94e4e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#0e0c0a;
  color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",sans-serif;
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  touch-action:none;
  user-select:none;
}
.wrap{
  position:relative;
  width:min(100%,940px);
  aspect-ratio:800/560;
}
canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:8px;
  background:#1c1915;
  border:3px solid #3a3026;
  box-shadow:0 18px 50px rgba(0,0,0,.75);
}
#ov{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(12,10,8,.84);
  border-radius:8px;
  padding:12px;
  z-index:10;
}
.pn{
  width:min(100%,560px);
  max-height:100%;
  overflow:auto;
  background:var(--panel);
  border:2px solid var(--border);
  box-shadow:0 6px 0 #0d0b09, 0 20px 50px rgba(0,0,0,.7);
  border-radius:8px;
  padding:clamp(12px,2.2vw,20px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(7px,1.3vw,10px);
  text-align:center;
  animation:pop .18s ease-out;
}
.pn.wide{width:min(100%,720px)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pn h2{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  letter-spacing:.04em;
  text-transform:uppercase;
  font-size:clamp(1.2rem,3.3vw,1.8rem);
  color:var(--gold);
  text-shadow:0 2px 0 #0b0907;
}
.pn p{
  margin:0;
  color:var(--muted);
  font-size:clamp(.74rem,1.7vw,.85rem);
}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
button,input{
  font:inherit;
  border:2px solid var(--border);
  border-radius:6px;
  background:var(--panel-2);
  color:var(--text);
  padding:8px 13px;
}
button{
  cursor:pointer;
  font-weight:700;
  box-shadow:0 3px 0 #0d0b09;
  transition:transform .08s,border-color .1s,background .1s;
}
button:hover{border-color:var(--gold);background:#322b23}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #0d0b09}
button.back{
  border-color:#5a4d3f;
  color:#cbbba6;
  background:#191511;
}
button.back:hover{border-color:var(--gold);color:var(--gold)}
input{
  background:#14110e;
  font-weight:700;
}
input:focus{outline:none;border-color:var(--gold)}
#rc{width:min(100%,135px);text-transform:uppercase;text-align:center;letter-spacing:.15em}
#nick{width:min(100%,180px);text-align:center;letter-spacing:.03em}
#lk{text-transform:none;letter-spacing:0;font-size:.8rem;width:min(100%,270px);font-weight:400}
button.main{
  background:var(--gold);
  border-color:#f4c56a;
  color:#1a1308;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.05em;
  padding:9px 20px;
  font-size:.88rem;
  box-shadow:0 4px 0 #7a5212;
}
button.main:hover{background:#f0b548}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 #7a5212}

/* Sélecteur de skin */
.skin-bar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:#161310;
  border:1.5px solid #3a3026;
  border-radius:6px;
  padding:5px 12px;
}
.skin-bar button{padding:4px 10px;font-size:.82rem}
.skin-info{display:flex;align-items:center;gap:8px;min-width:142px;justify-content:center}
.skin-info canvas{
  width:38px;height:38px;
  border-radius:50%;
  background:#221e1a;
  border:1.5px solid #463b30;
  box-shadow:none;
}
.skin-info b{color:var(--gold);font-size:.84rem;text-transform:uppercase;letter-spacing:.04em}

.how{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;text-align:left}
.how div{
  background:#161310;
  border:1px solid #332a22;
  border-radius:6px;
  padding:7px 9px;
  font-size:clamp(.66rem,1.5vw,.75rem);
  color:#cbbba6;
  line-height:1.32;
}
.how b{color:var(--gold);text-transform:uppercase;font-size:.69rem;letter-spacing:.04em}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%}
.slot{
  border-radius:6px;
  padding:7px 6px;
  border:2px dashed var(--border);
  color:var(--muted);
  font-weight:700;
  font-size:.76rem;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.slot.on{border-style:solid;color:#111;border-color:rgba(0,0,0,.4)}
.slot small{display:block;font-size:.62rem;opacity:.8;font-weight:800;text-transform:uppercase}
.stats{display:flex;gap:8px;width:100%}
.stats div{
  flex:1;
  background:#161310;
  border:1px solid #332a22;
  border-radius:6px;
  padding:6px 4px;
}
.stats b{display:block;font-family:Georgia,serif;font-size:clamp(.95rem,2.6vw,1.3rem);color:var(--text)}
.stats small{color:var(--muted);font-size:.62rem;letter-spacing:.08em}
.pn .rec{color:var(--gold);font-weight:800;text-transform:uppercase;font-size:.76rem;letter-spacing:.05em}

/* Guide des combos */
#guideModal{
  display:none;
  position:absolute;
  inset:0;
  background:rgba(10,8,6,.9);
  z-index:25;
  align-items:center;
  justify-content:center;
  padding:14px;
  border-radius:8px;
}
.guide-box{
  width:min(100%,740px);
  max-height:100%;
  overflow-y:auto;
  background:var(--panel);
  border:2px solid var(--gold);
  border-radius:8px;
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.guide-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.guide-head h3{margin:0;color:var(--gold);font-family:Georgia,serif;text-transform:uppercase;font-size:1.1rem}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.g-card{
  background:#161310;
  border:1px solid #382f26;
  border-radius:5px;
  padding:6px 8px;
  font-size:.73rem;
  line-height:1.35;
}
.g-card.sup{border-color:#7a3333;background:#1c1313}
.g-card b{color:var(--gold);display:block;font-size:.78rem}
.g-card.sup b{color:#ff9e9e}
.g-card span{color:#a89986;font-size:.69rem;display:block}
.g-card em{font-style:normal;color:#f0e6d6;font-weight:700}

/* Tableau de statistiques de fin de partie */
.tbl-wrap{
  width:100%;
  overflow-x:auto;
  border:1.5px solid #3a3026;
  border-radius:6px;
  background:#14110e;
}
.stbl{
  width:100%;
  border-collapse:collapse;
  font-size:clamp(.65rem,1.5vw,.76rem);
  text-align:center;
}
.stbl th{
  background:#241e18;
  color:var(--gold);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:6px 5px;
  border-bottom:1.5px solid #3a3026;
  font-size:.62rem;
  white-space:nowrap;
}
.stbl th:first-child,.stbl td:first-child{text-align:left;padding-left:9px}
.stbl td{
  padding:6px 5px;
  border-bottom:1px solid #26201a;
  color:#dfd3c3;
  white-space:nowrap;
}
.stbl tr:last-child td{border-bottom:none}
.stbl tr.me-row{background:rgba(229,169,60,.08)}
.stbl td.top{color:var(--gold);font-weight:900}
.p-dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  margin-right:6px;
  vertical-align:middle;
  border:1px solid #0b0907;
}
.b-tag{
  display:inline-block;
  padding:1px 5px;
  border-radius:3px;
  font-size:.6rem;
  font-weight:800;
  margin:1px 2px;
}
.b-tag.c{background:rgba(229,169,60,.18);border:1px solid var(--gold);color:var(--gold)}
.b-tag.s{background:rgba(224,86,86,.22);border:1px solid var(--crimson);color:#ff9e9e}

/* Chat écrit */
#chatBox{
  display:none;
  position:absolute;
  left:10px;
  bottom:52px;
  width:min(280px,46%);
  z-index:16;
  flex-direction:column;
  gap:4px;
  pointer-events:none;
}
#chatLog{
  display:flex;
  flex-direction:column;
  gap:2px;
  max-height:110px;
  overflow-y:auto;
  padding:4px 6px;
  border-radius:5px;
  background:rgba(16,13,10,.45);
  transition:background .15s;
}
#chatBox.typing #chatLog,#chatBox.inLobby #chatLog{
  background:rgba(16,13,10,.88);
  border:1px solid var(--border);
  pointer-events:auto;
}
.c-msg{
  font-size:.71rem;
  line-height:1.25;
  text-shadow:0 1px 2px #000;
  word-break:break-word;
  transition:opacity .35s;
}
.c-msg.fade{opacity:.32}
#chatBox.typing .c-msg.fade,#chatBox.inLobby .c-msg.fade{opacity:1}
.c-msg.sys{color:#9c8e7c;font-style:italic}
#chatRow{
  display:flex;
  gap:4px;
  pointer-events:auto;
}
#chatIn{
  flex:1;
  padding:4px 8px;
  font-size:.74rem;
  font-weight:400;
  border-radius:4px;
  background:rgba(20,17,14,.92);
  border:1.5px solid var(--border);
  display:none;
}
#chatBox.typing #chatIn,#chatBox.inLobby #chatIn{display:block}
#chatToggle{
  padding:3px 8px;
  font-size:.66rem;
  background:rgba(24,20,16,.82);
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:4px;
  align-self:flex-start;
}
#chatToggle:hover{color:var(--gold);border-color:var(--gold)}
#chatBox.typing #chatToggle,#chatBox.inLobby #chatToggle{display:none}

/* Inventaire permanent en bas */
#invBar{
  display:none;
  position:absolute;
  left:10px;
  right:96px;
  bottom:10px;
  background:rgba(22,19,16,.9);
  border:1.5px solid var(--border);
  border-radius:6px;
  padding:4px 8px;
  align-items:center;
  gap:4px;
  flex-wrap:wrap;
  pointer-events:auto;
  z-index:5;
  box-shadow:0 3px 10px rgba(0,0,0,.5);
}
.inv-lbl{
  font-size:.62rem;
  font-weight:900;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--muted);
  background:#14110e;
  border:1px solid #362d24;
  padding:2px 5px;
  border-radius:4px;
}
.inv-item{
  background:#28221c;
  border:1px solid #4a3f34;
  border-radius:4px;
  padding:2px 5px;
  font-size:.65rem;
  font-weight:700;
  color:var(--text);
  display:inline-flex;
  align-items:center;
  gap:3px;
}
.inv-item.syn{border-color:var(--gold);color:#f7d086}
.inv-item em{font-style:normal;color:var(--gold);font-weight:900}
.inv-cmb{
  background:rgba(229,169,60,.18);
  border:1.5px solid var(--gold);
  border-radius:4px;
  padding:2px 6px;
  font-size:.65rem;
  font-weight:900;
  color:var(--gold);
  text-transform:uppercase;
  cursor:help;
}
.inv-sup{
  background:rgba(224,86,86,.22);
  border:1.5px solid var(--crimson);
  border-radius:4px;
  padding:2px 6px;
  font-size:.66rem;
  font-weight:900;
  color:#ff9e9e;
  text-transform:uppercase;
  box-shadow:0 0 8px rgba(224,86,86,.25);
  cursor:help;
}
@media (pointer:coarse){
  #invBar{right:165px}
}

/* Bouton Pause en jeu */
#pauseBtn{
  display:none;
  position:absolute;
  right:10px;
  bottom:10px;
  padding:6px 11px;
  font-size:.72rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  background:rgba(30,26,22,.92);
  border:2px solid var(--border);
  color:var(--text);
  z-index:6;
}
#pauseBtn:hover{border-color:var(--gold);color:var(--gold)}
@media (pointer:coarse){
  #pauseBtn{right:84px;bottom:14px}
}

/* Cartes d'amélioration centrées pendant la pause */
#pk{
  position:absolute;
  left:0;right:0;top:50%;
  transform:translateY(-15%);
  display:flex;gap:12px;justify-content:center;align-items:stretch;
  pointer-events:none;padding:0 18px;
  z-index:12;
}
#pk button{
  pointer-events:auto;
  flex:1;max-width:242px;
  text-align:left;
  display:flex;flex-direction:column;gap:5px;
  background:var(--panel);
  border:2px solid var(--gold);
  box-shadow:0 5px 0 #0b0907, 0 14px 30px rgba(0,0,0,.9);
  padding:13px 13px;
  font-size:clamp(.72rem,1.7vw,.85rem);
  position:relative;
}
#pk button:hover{background:#2d261e;transform:translateY(-3px)}
#pk b{color:var(--gold);font-size:.94rem}
#pk small{color:#cbbba6;font-weight:400;line-height:1.3}
#pk .cmbTag{
  margin-top:3px;
  background:rgba(229,169,60,.18);
  border:1px solid var(--gold);
  color:var(--gold);
  font-size:.65rem;
  font-weight:900;
  padding:3px 6px;
  border-radius:4px;
  line-height:1.25;
}
#pk .cmbTag.fuse{
  background:rgba(224,86,86,.25);
  border-color:var(--crimson);
  color:#ff9e9e;
}
#pk .cmbTag.full{
  background:rgba(156,142,124,.12);
  border-color:#5c5246;
  color:var(--muted);
}
#pk i{
  position:absolute;top:-11px;right:8px;
  background:var(--gold);color:#1a1308;
  border:1px solid #0b0907;
  border-radius:4px;font-style:normal;font-weight:900;font-size:.72rem;padding:2px 7px;
}
#pk span{
  align-self:center;background:var(--panel);border:2px solid var(--gold);
  padding:5px 9px;border-radius:4px;color:var(--gold);font-weight:800;font-size:.85rem;
}

/* Notifications */
#tt{position:absolute;top:22%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.t{
  padding:5px 14px;
  border-radius:4px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-size:clamp(.7rem,1.9vw,.84rem);
  background:#161310;
  border:2px solid currentColor;
  box-shadow:0 3px 0 #0a0807;
  animation:tt 2.1s forwards;
}
@keyframes tt{0%{opacity:0;transform:translateY(-6px)}10%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px)}}

#dash{
  display:none;position:absolute;right:12px;bottom:10px;
  width:62px;height:62px;border-radius:50%;
  background:var(--panel-2);border:2px solid var(--gold);color:var(--gold);
  font-size:.72rem;font-weight:900;letter-spacing:.05em;padding:0;touch-action:manipulation;
  z-index:6;
}
@media (pointer:coarse){#dash{display:block}}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="800" height="560"></canvas>
  <div id="invBar"></div>
  <div id="chatBox">
    <div id="chatLog"></div>
    <button id="chatToggle" type="button">Chat [Entrée]</button>
    <div id="chatRow"><input id="chatIn" maxlength="120" placeholder="Écrire un message… (Entrée pour envoyer)"></div>
  </div>
  <div id="pk"></div>
  <div id="tt"></div>
  <button id="pauseBtn" aria-label="Pause">Pause [P]</button>
  <button id="dash" aria-label="Esquive">DASH</button>
  <div id="ov"></div>
  <div id="guideModal"></div>
</div>
<script>
(function(){
var W=800,H=560,cv=document.getElementById("c"),ctx=cv.getContext("2d"),ov=document.getElementById("ov"),pk=document.getElementById("pk"),pauseBtn=document.getElementById("pauseBtn"),invBar=document.getElementById("invBar"),guideModal=document.getElementById("guideModal");
var chatBox=document.getElementById("chatBox"),chatLog=document.getElementById("chatLog"),chatIn=document.getElementById("chatIn"),chatToggle=document.getElementById("chatToggle");
var best=0,savedNick="",savedSkin=0,ws,S=null,vis=[],keys={},ptr=null,PA=[],DEC=[],RINGS=[],FLOATS=[],GHOSTS=[],TR=[[],[],[],[],[],[]],tt=0,shake=0,lastHp=[],lastE=[],flashE={},BG=null,ovKey="",pkKey="",invKey="",last=0,lastIn="",idle=0;
var FONT='"Trebuchet MS","Segoe UI",sans-serif',SERIF='Georgia,"Times New Roman",serif';
var CO=["#59b878","#5b8fd9","#e09a3e","#d96277","#9b6bd9","#45b8b0"];
var CO_DARK=["#2b663f","#2c4f87","#8c5a19","#853040","#573485","#226964"];
var SKINS=["Recrue","Chevalier","Ninja","Viking","Mage","Cyber","Couronne","Faucheuse"];

var EC=["#c94a4a","#d97b38","#7e52a0","#cbb042","#9e2a3b","#4fb3bf","#ff6b2b","#b8432e","#4e8c6f","#8e44ad"];
var ER=[11,8,17,10,30,10,9,13,12,13];
var BOSS_COLS=["#9e2a3b","#c4492b","#3b7a9e","#7a3b9e","#b88628"];
var UP_SHORT=["Dégâts","Cadence","Tir multi","Perforation","Vitesse","Aimant","Régén.","Lames","Armure"];
var COMBO_DEFS=[
 {id:0,req:[0,1],reqTxt:"Dégâts + Cadence",name:"Mitrailleuse lourde",desc:"Dégâts ×1,22 · Cadence ×1,22"},
 {id:1,req:[2,3],reqTxt:"Tir multiple + Perforation",name:"Pluie d'acier",desc:"+1 projectile · +1 perforation"},
 {id:2,req:[7,4],reqTxt:"Lames orbitales + Vitesse",name:"Tempête de lames",desc:"+2 lames · Vitesse lames ×1,3"},
 {id:3,req:[6,8],reqTxt:"Régénération + Soin & armure",name:"Forteresse vivante",desc:"+25 PV max · +1,2 PV/s"},
 {id:4,req:[5,7],reqTxt:"Aimant + Lames orbitales",name:"Vortex magnétique",desc:"Aimant ×1,5 · +1 PV/gemme"}
];
var SUPER_DEFS=[
 {id:0,reqTxt:"Mitrailleuse lourde + Pluie d'acier",name:"Apocalypse Balistique",desc:"Dégâts ×1,38 · Cadence ×1,2 · +2 tirs · +1 perf."},
 {id:1,reqTxt:"Mitrailleuse lourde + Tempête de lames",name:"Canon à Lames",desc:"Dégâts ×1,32 · Cadence ×1,3 · +2 lames"},
 {id:2,reqTxt:"Mitrailleuse lourde + Forteresse vivante",name:"Juggernaut d'Encre",desc:"+40 PV max · Dégâts ×1,38 · +1,6 PV/s"},
 {id:3,reqTxt:"Mitrailleuse lourde + Vortex magnétique",name:"Surcharge Magnétique",desc:"Cadence ×1,38 · Dégâts ×1,2 · +2 PV/gemme"},
 {id:4,reqTxt:"Pluie d'acier + Tempête de lames",name:"Déluge Rasoir",desc:"+2 tirs · +2 lames · Vitesse ×1,15"},
 {id:5,reqTxt:"Pluie d'acier + Forteresse vivante",name:"Rempart d'Acier",desc:"+40 PV max · +1 tir · +2 perf. · +1,6 PV/s"},
 {id:6,reqTxt:"Pluie d'acier + Vortex magnétique",name:"Orage Magnétique",desc:"+2 tirs · +1 perf. · Aimant ×1,7 · +2 PV/gemme"},
 {id:7,reqTxt:"Tempête de lames + Forteresse vivante",name:"Citadelle Tournoyante",desc:"+40 PV max · +3 lames · +1,4 PV/s"},
 {id:8,reqTxt:"Tempête de lames + Vortex magnétique",name:"Singularité Tranchante",desc:"+3 lames · Aimant ×1,8 · +2 PV/gemme"},
 {id:9,reqTxt:"Forteresse vivante + Vortex magnétique",name:"Bastion Astral",desc:"+45 PV max · +2 PV/s · +2 PV/gemme"}
];
var room=(new URLSearchParams(location.search).get("room")||"").toUpperCase();
var tq=document.getElementById("tt");

try{
  best=parseInt(localStorage.getItem("survivor-best"),10)||0;
  savedNick=localStorage.getItem("survivor-nick")||"";
  savedSkin=Math.max(0,Math.min(SKINS.length-1,parseInt(localStorage.getItem("survivor-skin"),10)||0));
}catch(e){}

function pName(i){
  if(S&&S.names&&S.names[i])return S.names[i];
  return "J"+(i+1);
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function toast(m,c){
  var d=document.createElement("div");
  d.className="t";d.style.color=c;d.textContent=m;
  tq.appendChild(d);
  setTimeout(function(){d.remove()},2100);
}

/* ---------- Dessin des skins ---------- */
function drawSkinDetail(g,skin,c,cd,aimAngle){
  g.save();
  if(skin===1){
    // Chevalier : casque métallique + cimier
    g.strokeStyle="#cfd6de";g.lineWidth=2.5;
    g.beginPath();g.arc(0,0,11,-2.5,-0.64);g.stroke();
    g.fillStyle="#d94e4e";g.strokeStyle="#120d0a";g.lineWidth=1.4;
    g.beginPath();g.moveTo(-2,-11);g.lineTo(0,-17);g.lineTo(3,-11);g.closePath();g.fill();g.stroke();
  }else if(skin===2){
    // Ninja : bandeau frontal + rubans flottants
    g.fillStyle="#1c1917";
    g.fillRect(-10.5,-5.5,21,3.5);
    g.strokeStyle="#120d0a";g.lineWidth=1.5;
    g.beginPath();g.moveTo(-10,-4);g.lineTo(-17,-8);g.moveTo(-10,-3);g.lineTo(-16,-1);g.stroke();
  }else if(skin===3){
    // Viking : casque à cornes d'ivoire
    g.fillStyle="#f0e6d6";g.strokeStyle="#120d0a";g.lineWidth=1.6;
    g.beginPath();g.moveTo(-9,-5);g.quadraticCurveTo(-17,-12,-13,-17);g.quadraticCurveTo(-10,-11,-6,-8);g.closePath();g.fill();g.stroke();
    g.beginPath();g.moveTo(9,-5);g.quadraticCurveTo(17,-12,13,-17);g.quadraticCurveTo(10,-11,6,-8);g.closePath();g.fill();g.stroke();
  }else if(skin===4){
    // Mage : chapeau pointu étoilé
    g.fillStyle="#3a285c";g.strokeStyle="#120d0a";g.lineWidth=1.8;
    g.beginPath();g.moveTo(-13,-6);g.lineTo(13,-6);g.lineTo(2,-20);g.closePath();g.fill();g.stroke();
    g.fillStyle="#ffd166";
    g.beginPath();g.arc(1,-11,2,0,6.283);g.fill();
  }else if(skin===5){
    // Cyber : visière néon + antenne
    g.strokeStyle="#120d0a";g.lineWidth=2;
    g.beginPath();g.moveTo(6,-9);g.lineTo(8,-16);g.stroke();
    g.fillStyle="#66f7ff";
    g.beginPath();g.arc(8,-16,2.2,0,6.283);g.fill();
    g.save();g.rotate(aimAngle);
    g.fillStyle="#66f7ff";g.strokeStyle="#120d0a";g.lineWidth=1.2;
    g.fillRect(1,-4.5,7.5,9);g.strokeRect(1,-4.5,7.5,9);
    g.restore();
  }else if(skin===6){
    // Couronne : couronne dorée royale
    g.fillStyle="#ffd166";g.strokeStyle="#120d0a";g.lineWidth=1.6;
    g.beginPath();
    g.moveTo(-8,-8);g.lineTo(-9,-16);g.lineTo(-4,-12);g.lineTo(0,-17);g.lineTo(4,-12);g.lineTo(9,-16);g.lineTo(8,-8);
    g.closePath();g.fill();g.stroke();
  }else if(skin===7){
    // Faucheuse : capuche sombre + yeux luisants
    g.fillStyle="#181512";g.strokeStyle="#0a0807";g.lineWidth=1.8;
    g.beginPath();g.arc(0,-1,11.8,Math.PI*0.85,Math.PI*2.15);g.closePath();g.fill();g.stroke();
    var ex=Math.cos(aimAngle)*4,ey=Math.sin(aimAngle)*4;
    g.fillStyle="#ff6b6b";
    g.beginPath();g.arc(ex-2,ey,1.7,0,6.283);g.arc(ex+2,ey,1.7,0,6.283);g.fill();
  }
  g.restore();
}

function renderSkinPreview(canvasEl,skinIdx,colIdx){
  if(!canvasEl)return;
  var g=canvasEl.getContext("2d");
  g.clearRect(0,0,44,44);
  var c=CO[colIdx%6],cd=CO_DARK[colIdx%6];
  g.save();
  g.translate(22,25);
  g.fillStyle=c;g.beginPath();g.arc(0,0,11,0,6.283);g.fill();
  g.fillStyle=cd;g.beginPath();g.arc(0,2,9.5,0.2,Math.PI-0.2);g.fill();
  g.strokeStyle="#120d0a";g.lineWidth=2.4;g.beginPath();g.arc(0,0,11,0,6.283);g.stroke();
  if(skinIdx!==5&&skinIdx!==7){
    g.fillStyle="#f5ebd6";g.beginPath();g.arc(3.5,0,4.5,0,6.283);g.fill();
    g.strokeStyle="#120d0a";g.lineWidth=1.5;g.stroke();
  }
  drawSkinDetail(g,skinIdx,c,cd,0);
  g.restore();
}

function addRing(x,y,rMax,c,lw){
  RINGS.push({x:x,y:y,r:6,rm:rMax,c:c,lw:lw||3,l:.38,ml:.38});
}
function addFloat(x,y,txt,c){
  FLOATS.push({x:x,y:y,txt:txt,c:c,l:1.25,ml:1.25});
}

function burst(x,y,c,n,leaveStain){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283,s=35+Math.random()*125;
    PA.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.26+Math.random()*.28,ml:.54,sz:2+Math.random()*3.2,c:c});
  }
  if(leaveStain){
    DEC.push({x:x+(Math.random()-.5)*8,y:y+(Math.random()-.5)*8,r:4+Math.random()*7,c:c,a:.26});
    if(DEC.length>140)DEC.shift();
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function mkBG(){
  BG=document.createElement("canvas");BG.width=W;BG.height=H;
  var g=BG.getContext("2d");
  g.fillStyle="#221e1a";g.fillRect(0,0,W,H);
  var ts=48;
  for(var y=0;y<H;y+=ts){
    for(var x=0;x<W;x+=ts){
      var v=((x*17+y*31)%11)-5;
      g.fillStyle="rgb("+(35+v)+","+(31+v)+","+(27+v)+")";
      g.fillRect(x+1,y+1,ts-2,ts-2);
      g.fillStyle="rgba(255,240,220,.03)";
      g.fillRect(x+2,y+2,ts-4,2);
    }
  }
  for(var i=0;i<1600;i++){
    var gx=Math.random()*W,gy=Math.random()*H;
    g.fillStyle=Math.random()>.5?"rgba(0,0,0,.18)":"rgba(255,235,210,.035)";
    g.fillRect(gx,gy,2,2);
  }
  g.strokeStyle="rgba(10,8,6,.45)";g.lineWidth=1.5;
  for(var c=0;c<18;c++){
    var cx=40+Math.random()*(W-80),cy=40+Math.random()*(H-80);
    g.beginPath();g.moveTo(cx,cy);
    for(var s=0;s<3;s++){cx+=(Math.random()-.5)*22;cy+=(Math.random()-.5)*22;g.lineTo(cx,cy)}
    g.stroke();
  }
  for(var m=0;m<24;m++){
    var mx=20+Math.random()*(W-40),my=20+Math.random()*(H-40);
    g.fillStyle="rgba(76,94,54,.24)";
    g.beginPath();g.arc(mx,my,3+Math.random()*5,0,6.283);g.fill();
  }
  var vg=g.createRadialGradient(W/2,H/2,W*.25,W/2,H/2,W*.68);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(8,6,5,.55)");
  g.fillStyle=vg;g.fillRect(0,0,W,H);
  g.strokeStyle="#120f0c";g.lineWidth=6;g.strokeRect(3,3,W-6,H-6);
  g.strokeStyle="#463b30";g.lineWidth=2;g.strokeRect(6,6,W-12,H-12);
}

function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onopen=function(){send({t:"join",room:room,name:savedNick,skin:savedSkin});history.replaceState(null,"","?room="+room)};
  ws.onmessage=function(e){
    var d=JSON.parse(e.data);
    if(d.t==="full"){
      var old=ws;ws=null;try{old.close()}catch(err){}
      S=null;ovKey="";lobby("Salle complète (6/6), choisis un autre code.");return;
    }
    if(d.t==="chat"){addChatMsg(d);return}
    onState(d);
  };
  ws.onclose=function(){if(ws&&S){S=null;ovKey="";lobby("Connexion interrompue.")}};
}

function buildStatsTable(d){
  var rows=d.stats||[];
  if(!rows.length)return "";
  var maxK=Math.max.apply(null,rows.map(function(r){return r.kills}));
  var maxD=Math.max.apply(null,rows.map(function(r){return r.dmg}));
  var maxR=Math.max.apply(null,rows.map(function(r){return r.rev}));
  var maxG=Math.max.apply(null,rows.map(function(r){return r.gems}));

  var body=rows.map(function(r){
    var isMe=r.i===d.me;
    var nm=esc(r.name||("J"+(r.i+1)));
    var label=isMe?(nm+" (TOI)"):nm;
    var tags=[];
    (r.sup||[]).forEach(function(s){
      var sd=SUPER_DEFS[s.id];
      if(sd)tags.push('<span class="b-tag s">✦ '+sd.name+(s.lvl>1?' N.'+s.lvl:'')+'</span>');
    });
    (r.cmb||[]).forEach(function(c){
      var cd=COMBO_DEFS[c.id];
      if(cd)tags.push('<span class="b-tag c">★ '+cd.name+' N.'+c.lvl+'</span>');
    });
    var buildStr=tags.length?tags.join(" "):'<span style="color:var(--muted)">—</span>';

    return '<tr class="'+(isMe?'me-row':'')+'">'+
      '<td><span class="p-dot" style="background:'+CO[r.i%6]+'"></span><b>'+label+'</b></td>'+
      '<td class="'+(r.kills>0&&r.kills===maxK?'top':'')+'">'+fmtNum(r.kills)+'</td>'+
      '<td class="'+(r.dmg>0&&r.dmg===maxD?'top':'')+'">'+fmtNum(r.dmg)+'</td>'+
      '<td>'+fmtNum(r.taken)+'</td>'+
      '<td class="'+(r.rev>0&&r.rev===maxR?'top':'')+'">'+fmtNum(r.rev)+'</td>'+
      '<td class="'+(r.gems>0&&r.gems===maxG?'top':'')+'">'+fmtNum(r.gems)+'</td>'+
      '<td style="white-space:normal;min-width:130px">'+buildStr+'</td>'+
    '</tr>';
  }).join("");

  return '<div class="tbl-wrap"><table class="stbl">'+
    '<thead><tr>'+
      '<th>Joueur</th>'+
      '<th>Éliminés</th>'+
      '<th>Dégâts</th>'+
      '<th>Subis</th>'+
      '<th>Réanim.</th>'+
      '<th>Gemmes</th>'+
      '<th>Combos actifs</th>'+
    '</tr></thead>'+
    '<tbody>'+body+'</tbody>'+
  '</table></div>';
}

function onState(d){
  d.ev.forEach(function(v){
    if(v[2]===5&&v.length>=6){
      var cdef=COMBO_DEFS[v[4]];
      var cname=cdef?cdef.name:"Combo";
      var clvl=v[5]||1;
      burst(v[0],v[1],"#e5a93c",26,false);
      addRing(v[0],v[1],70,"#e5a93c",3.5);
      addFloat(v[0],v[1]-24,(clvl>1?"CUMUL NIV."+clvl+" : ":"COMBO : ")+cname,"#e5a93c");
      if(v[3]===d.me)toast((clvl>1?"Combo cumulé Niv."+clvl+" : ":"Combo : ")+cname+(cdef?" ("+cdef.desc+")":""),"#e5a93c");
      return;
    }
    if(v[2]===6&&v.length>=6){
      var sdef=SUPER_DEFS[v[4]];
      var sname=sdef?sdef.name:"Fusion";
      var slvl=v[5]||1;
      burst(v[0],v[1],"#e05656",42,false);
      addRing(v[0],v[1],105,"#e05656",5);
      addRing(v[0],v[1],65,"#ffd166",3);
      addFloat(v[0],v[1]-28,(slvl>1?"FUSION NIV."+slvl+" : ":"COMBO DE COMBO : ")+sname,"#ff9e9e");
      if(v[3]===d.me){
        shake=8;
        toast("COMBO DE COMBO : "+sname+(sdef?" ("+sdef.desc+")":""),"#ff9e9e");
      }
      return;
    }
    var col=EC[v[2]]||"#c94a4a";
    burst(v[0],v[1],col,v[2]===4?45:(v[2]===6?24:9),v[2]!==5&&v[2]!==9);
    addRing(v[0],v[1],v[2]===4?85:(v[2]===6?58:26),col,v[2]===4?4:2);
    if(v[2]===4)shake=11;
    if(v[2]===6)shake=5;
  });

  d.p.forEach(function(p,i){
    if(lastHp[i]!==undefined&&p[2]<lastHp[i]){
      if(i===d.me)shake=6;
      if(vis[i]){
        burst(vis[i].x,vis[i].y,"#f0e6d6",7,false);
        addFloat(vis[i].x,vis[i].y-16,"-"+Math.ceil(lastHp[i]-p[2]),"#d94e4e");
      }
    }
    lastHp[i]=p[2];
  });

  d.E.forEach(function(e,idx){
    var key=e[2]+"_"+Math.round(e[0]/25)+"_"+Math.round(e[1]/25);
    if(lastE[idx]&&e[3]<lastE[idx][3])flashE[key]=.07;
  });
  lastE=d.E;

  var wasB=S&&S.E.some(function(e){return e[2]===4}),isB=d.E.some(function(e){return e[2]===4});
  if(S&&d.st==="play"){
    if(d.wv>S.wv){
      var msg=d.wv===50?"VAGUE FINALE 50 — LES 5 BOSS !"
        :(d.wv>=45?"Vague "+d.wv+" — Assaut Multi-Boss !"
        :(d.wv%5===0?"Vague "+d.wv+" — Boss !":"Vague "+d.wv));
      toast(msg,(d.wv>=45||d.wv%5===0)?"#d94e4e":"#e5a93c");
      addRing(W/2,H/2,240,"rgba(229,169,60,.35)",2);
    }
    if(wasB&&!isB)toast("Boss vaincu — Alliés relevés","#e5a93c");

/* ---------- Dessin des personnages & ennemis ---------- */
function drawEnemy(e,a){
  var x=e[0],y=e[1],k=e[2],bk=e[4]||0,charging=e[5]||0;
  var r=k===4?(bk===4?36:(bk===3?34:(bk===1?26:31))):(ER[k]||11);
  var c=k===4?BOSS_COLS[bk]:(EC[k]||"#c94a4a");
  var key=k+"_"+Math.round(x/25)+"_"+Math.round(y/25);
  var hit=flashE[key]>0;
  var phase=x*.09+y*.05;
  var fast=(k===1||k===6||charging);
  var step=S&&S.pz?0:Math.sin(tt*(fast?22:12)+phase);
  var tilt=S&&S.pz?0:Math.cos(tt*(fast?11:6)+phase)*.09;

  if(k===4&&(charging||e[3]<50)){
    ctx.save();
    ctx.strokeStyle=charging?"rgba(255,209,102,.55)":"rgba(224,86,86,.35)";
    ctx.lineWidth=charging?3:2;
    ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.arc(x,y,r+10+Math.sin(tt*10)*3,0,6.283);ctx.stroke();
    ctx.restore();
  }

  ctx.fillStyle="rgba(8,6,5,.48)";
  ctx.beginPath();ctx.ellipse(x,y+r*.85,r*(.92+step*.05),r*.36,0,0,6.283);ctx.fill();

  ctx.save();
  ctx.translate(x,y-Math.abs(step)*1.8);
  ctx.rotate(tilt);
  ctx.scale(1+step*.08,1-step*.08);

  if(k===5)ctx.globalAlpha=0.72+Math.sin(tt*8+phase)*0.15;

  if(k===2||k===4){
    ctx.fillStyle=hit?"#fff":(bk===4?"#e5a93c":"#2a1e1c");
    ctx.strokeStyle="#0d0a08";ctx.lineWidth=2;
    var spikes=k===4?(bk===4?14:(bk===1?6:10)):6;
    for(var i=0;i<spikes;i++){
      var an=i*(6.283/spikes)+(S&&S.pz?0:tt*(k===4?(bk===1?1.8:.8):0));
      ctx.beginPath();
      ctx.moveTo(Math.cos(an-.22)*r*.85,Math.sin(an-.22)*r*.85);
      ctx.lineTo(Math.cos(an)*r*1.38,Math.sin(an)*r*1.38);
      ctx.lineTo(Math.cos(an+.22)*r*.85,Math.sin(an+.22)*r*.85);
      ctx.closePath();ctx.fill();ctx.stroke();
    }
  }else if(k===7){
    ctx.fillStyle=hit?"#fff":"#f0e6d6";ctx.strokeStyle="#120d0a";ctx.lineWidth=2;
    for(var h=-1;h<=1;h+=2){
      var ha=a+h*.55;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ha-.25)*r*.7,Math.sin(ha-.25)*r*.7);
      ctx.lineTo(Math.cos(ha)*r*1.55,Math.sin(ha)*r*1.55);
      ctx.lineTo(Math.cos(ha+.25)*r*.7,Math.sin(ha+.25)*r*.7);
      ctx.closePath();ctx.fill();ctx.stroke();
    }
  }else if(k===8){
    ctx.save();ctx.rotate(a);
    ctx.fillStyle="#28221c";ctx.strokeStyle="#120d0a";ctx.lineWidth=2;
    rr(2,-5,r+5,10,2);ctx.fill();ctx.stroke();
    ctx.restore();
  }

  if(k===6){
    var pulse=Math.floor(tt*14)%2;
    ctx.fillStyle=hit?"#fff":(pulse?"#ff9f1c":"#e04819");
  }else{
    ctx.fillStyle=hit?"#fff":c;
  }
  ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();

  if(!hit){
    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.beginPath();ctx.arc(0,r*.2,r*.88,0.1,Math.PI-0.1);ctx.fill();
  }

  ctx.strokeStyle=charging?"#ffd166":"#120d0a";
  ctx.lineWidth=k===4?3.2:(charging?3:2.2);
  ctx.stroke();

  if((k===4||k===9)&&!hit){
    ctx.strokeStyle=k===9?"#d8a7ff":(bk===4?"#ffd166":"rgba(0,0,0,.35)");
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,r*.55,0,6.283);ctx.stroke();
  }

  if(!hit){
    for(var s=-1;s<=1;s+=2){
      var ex=Math.cos(a)*r*.38+Math.cos(a+1.57)*s*r*.35;
      var ey=Math.sin(a)*r*.38+Math.sin(a+1.57)*s*r*.35;
      ctx.fillStyle=(k===4||k===6)?"#ffd166":"#f5ebd6";
      ctx.beginPath();ctx.arc(ex,ey,r*.24,0,6.283);ctx.fill();
      ctx.fillStyle="#120d0a";
      ctx.beginPath();ctx.arc(ex+Math.cos(a)*r*.08,ey+Math.sin(a)*r*.08,r*.12,0,6.283);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  ctx.restore();

  if(k===2||k===7||k===9){
    ctx.fillStyle="#120d0a";rr(x-r-1,y-r-14,r*2+2,5,2);ctx.fill();
    ctx.fillStyle="#d94e4e";
    rr(x-r,y-r-13,Math.max(2,r*2*e[3]/100),3,1);ctx.fill();
  }
}

function drawPlayer(p,i,v,aimAngle){
  var c=CO[i%6],cd=CO_DARK[i%6],T=TR[i],skin=p[16]||0;
  var spd=Math.min(1,Math.hypot(v.vx||0,v.vy||0)/6);
  var bob=S&&S.pz?0:Math.sin(tt*15+i)*2.2*spd;
  var sq=S&&S.pz?0:Math.sin(tt*15+i)*.09*spd;
  var lean=(v.vx||0)*.022;

  if(p[4]){
    var revBy=p[17]||0;
    ctx.strokeStyle=revBy>1?"rgba(89,184,120,.55)":"rgba(240,230,214,.25)";
    ctx.lineWidth=revBy>1?2.5:1.5;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.arc(v.x,v.y,62,0,6.283);ctx.stroke();ctx.setLineDash([]);

    ctx.strokeStyle="#120d0a";ctx.lineWidth=6;ctx.beginPath();ctx.arc(v.x,v.y,21,0,6.283);ctx.stroke();
    ctx.strokeStyle=revBy>1?"#59b878":c;ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(v.x,v.y,21,-1.57,-1.57+6.283*p[5]/2.2);ctx.stroke();

    ctx.fillStyle="#5c5349";ctx.strokeStyle="#120d0a";ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(v.x,v.y,10,0,6.283);ctx.fill();ctx.stroke();

    ctx.fillStyle=revBy>1?"#7ee09b":"#f0e6d6";ctx.font="bold 10px "+FONT;ctx.textAlign="center";
    var dTxt=pName(i)+" (À TERRE"+(revBy>1?" · RÉANIM ×"+revBy:"")+")";
    ctx.fillText(dTxt,v.x,v.y-29);
    return;
  }

  // Aura dorée quand le Lien Total est actif
  if(p[15]===2){
    ctx.save();
    ctx.strokeStyle="rgba(255,209,102,.45)";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(v.x,v.y,16+Math.sin(tt*8+i)*1.5,0,6.283);ctx.stroke();
    ctx.restore();
  }

  if(i===S.me){
    ctx.strokeStyle="rgba(240,230,214,.09)";ctx.lineWidth=1;ctx.setLineDash([4,6]);
    ctx.beginPath();ctx.arc(v.x,v.y,p[8],0,6.283);ctx.stroke();ctx.setLineDash([]);
  }

  for(var k=0;k<T.length;k+=2){
    var f=k/T.length;
    ctx.fillStyle="rgba(20,17,14,"+(f*.28)+")";
    ctx.beginPath();ctx.arc(T[k].x,T[k].y,4.2*f,0,6.283);ctx.fill();
  }

  ctx.fillStyle="rgba(8,6,5,.5)";
  ctx.beginPath();ctx.ellipse(v.x,v.y+10,11*(1+sq*.5),4.5,0,0,6.283);ctx.fill();

  ctx.globalAlpha=p[6]&&Math.floor(tt*20)%2?.35:1;

  var kick=(v.recoil||0)*4.5;
  ctx.save();
  ctx.translate(v.x,v.y-Math.abs(bob));
  ctx.rotate(aimAngle);
  ctx.fillStyle="#4a423a";ctx.strokeStyle="#120d0a";ctx.lineWidth=2;
  rr(4-kick,-3,13,6,2);ctx.fill();ctx.stroke();
  if((v.flash||0)>0){
    ctx.fillStyle=c;
    ctx.beginPath();ctx.arc(19-kick,0,4.5*v.flash,0,6.283);ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.translate(v.x,v.y-Math.abs(bob));
  ctx.rotate(lean);
  ctx.scale(1+sq,1-sq);

  ctx.fillStyle=c;
  ctx.beginPath();ctx.arc(0,0,11,0,6.283);ctx.fill();
  ctx.fillStyle=cd;
  ctx.beginPath();ctx.arc(0,2,9.5,0.2,Math.PI-0.2);ctx.fill();
  ctx.strokeStyle="#120d0a";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(0,0,11,0,6.283);ctx.stroke();

  if(skin!==5&&skin!==7){
    var vx=Math.cos(aimAngle)*3.5,vy=Math.sin(aimAngle)*3.5;
    ctx.fillStyle="#f5ebd6";
    ctx.beginPath();ctx.arc(vx,vy,4.5,0,6.283);ctx.fill();
    ctx.strokeStyle="#120d0a";ctx.lineWidth=1.5;ctx.stroke();
  }
  drawSkinDetail(ctx,skin,c,cd,aimAngle);
  ctx.restore();

  ctx.globalAlpha=1;

  if(p[10]){
    var ospd=p[14]||1;
    for(var q=0;q<p[10];q++){
      var oa=S.oa*ospd+q*6.283/p[10],bx=v.x+Math.cos(oa)*46,by=v.y+Math.sin(oa)*46;
      ctx.strokeStyle="rgba(216,207,192,.28)";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(v.x,v.y,46,oa-.35,oa);ctx.stroke();

      ctx.save();ctx.translate(bx,by);ctx.rotate(oa+1.57);
      ctx.fillStyle="#d8cfc0";ctx.strokeStyle="#120d0a";ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(5,0);ctx.lineTo(0,8);ctx.lineTo(-5,0);ctx.closePath();
      ctx.fill();ctx.stroke();ctx.restore();
    }
  }

  ctx.fillStyle=i===S.me?"#ffd166":"#f0e6d6";ctx.font="bold 10px "+FONT;ctx.textAlign="center";
  ctx.fillText(pName(i),v.x,v.y-21);
}

/* ---------- Rendu principal ---------- */
function draw(){
  tt=performance.now()/1000;
  if(!BG)mkBG();
  ctx.save();
  if(shake>0&&!(S&&S.pz))ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.drawImage(BG,0,0);

  DEC.forEach(function(d){
    ctx.globalAlpha=d.a;ctx.fillStyle=d.c;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.283);ctx.fill();
  });
  ctx.globalAlpha=1;

  RINGS.forEach(function(rg){
    var a=Math.max(0,rg.l/rg.ml);
    ctx.globalAlpha=a*.85;ctx.strokeStyle=rg.c;ctx.lineWidth=rg.lw*a;
    ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,6.283);ctx.stroke();
  });
  ctx.globalAlpha=1;

  GHOSTS.forEach(function(gh){
    ctx.globalAlpha=Math.max(0,gh.l/.22)*.42;
    ctx.fillStyle=gh.c;
    ctx.beginPath();ctx.arc(gh.x,gh.y,10,0,6.283);ctx.fill();
  });
  ctx.globalAlpha=1;

  if(S&&S.st!=="wait"){
    var pl=S.p;

    S.G.forEach(function(g){
      var y=g[1]+(S.pz?0:Math.sin(tt*4.5+g[0])*2);
      ctx.fillStyle="#3fa796";ctx.strokeStyle="#120d0a";ctx.lineWidth=1.8;
      ctx.beginPath();
      ctx.moveTo(g[0],y-7);ctx.lineTo(g[0]+5,y);ctx.lineTo(g[0],y+7);ctx.lineTo(g[0]-5,y);
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle="#9be8d8";
      ctx.beginPath();ctx.moveTo(g[0],y-5);ctx.lineTo(g[0]+2.5,y);ctx.lineTo(g[0],y);ctx.closePath();ctx.fill();
    });

    S.E.forEach(function(e){
      var a=0,nd=1e9;
      pl.forEach(function(p,j){
        if(p[4]||!vis[j])return;
        var d=(vis[j].x-e[0])**2+(vis[j].y-e[1])**2;
        if(d<nd){nd=d;a=Math.atan2(vis[j].y-e[1],vis[j].x-e[0])}
      });
      drawEnemy(e,a);
    });

    S.B.forEach(function(b){
      var hv=b[5],col=CO[b[4]%6];
      ctx.strokeStyle="#120d0a";ctx.lineWidth=hv?6.5:5;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(b[0]-b[2]*.034,b[1]-b[3]*.034);ctx.lineTo(b[0],b[1]);ctx.stroke();
      ctx.strokeStyle=col;ctx.lineWidth=hv?3.8:2.5;
      ctx.beginPath();ctx.moveTo(b[0]-b[2]*.034,b[1]-b[3]*.034);ctx.lineTo(b[0],b[1]);ctx.stroke();
    });

    S.X.forEach(function(b){
      ctx.fillStyle="#d94e4e";ctx.strokeStyle="#120d0a";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b[0],b[1],4.5,0,6.283);ctx.fill();ctx.stroke();
    });

    // Liens d'escouade (dorés pulsants en Lien Total)
    (S.lks||[]).forEach(function(pair){
      var v0=vis[pair[0]],v1=vis[pair[1]];
      if(!v0||!v1)return;
      ctx.strokeStyle="#120d0a";ctx.lineWidth=S.flk?6:4;
      ctx.beginPath();ctx.moveTo(v0.x,v0.y);ctx.lineTo(v1.x,v1.y);ctx.stroke();
      ctx.strokeStyle=S.flk?"#ffd166":"#e5a93c";
      ctx.lineWidth=S.flk?3.2:2;
      if(!S.flk)ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.moveTo(v0.x,v0.y);ctx.lineTo(v1.x,v1.y);ctx.stroke();
      ctx.setLineDash([]);
    });

    pl.forEach(function(p,i){
      var v=vis[i];if(!v)return;
      var aim=0,nd=1e9;
      S.E.forEach(function(e){
        var d=(e[0]-v.x)**2+(e[1]-v.y)**2;
        if(d<nd){nd=d;aim=Math.atan2(e[1]-v.y,e[0]-v.x)}
      });
      drawPlayer(p,i,v,aim);
    });

    PA.forEach(function(p){
      ctx.globalAlpha=Math.max(0,p.l/p.ml);
      ctx.fillStyle=p.c;
      ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
    });
    ctx.globalAlpha=1;

    FLOATS.forEach(function(fl){
      var a=Math.min(1,fl.l/fl.ml*1.5);
      ctx.globalAlpha=a;
      ctx.font="bold 11px "+FONT;ctx.textAlign="center";
      ctx.fillStyle="#120d0a";ctx.fillText(fl.txt,fl.x+1,fl.y+1);
      ctx.fillStyle=fl.c;ctx.fillText(fl.txt,fl.x,fl.y);
    });
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // HUD
  if(S&&S.st!=="wait"){
    var me=S.p[S.me];
    if(me&&me[6]&&!S.pz){
      ctx.strokeStyle="rgba(217,78,78,.55)";ctx.lineWidth=14;ctx.strokeRect(7,7,W-14,H-14);
    }

    ctx.fillStyle="#120d0a";ctx.fillRect(0,0,W,8);
    ctx.fillStyle="#3fa796";ctx.fillRect(0,0,W*Math.min(1,S.xp/S.nd),7);
    ctx.fillStyle="#120d0a";ctx.fillRect(0,7,W,1);

    S.p.forEach(function(p,i){
      var col=i%2,row=Math.floor(i/2);
      var x=col?W-166:12,y=14+row*22;
      var hp=Math.max(0,p[2]/p[3]);
      rr(x,y,154,18,4);ctx.fillStyle="#161310";ctx.fill();
      if(hp>0){
        rr(x+2,y+2,Math.max(4,150*hp),14,2);
        ctx.fillStyle=p[4]?"#5c5349":CO[i%6];ctx.fill();
      }
      if(i===S.me){
        var rd=Math.max(0,1-p[9]/2.0);
        ctx.fillStyle="#120d0a";ctx.fillRect(x+2,y+13,150,3);
        ctx.fillStyle=rd>=1?"#ffd166":"#7a6d5d";ctx.fillRect(x+2,y+13,150*rd,3);
      }
      rr(x,y,154,18,4);ctx.strokeStyle=i===S.me?"#e5a93c":"#463b30";ctx.lineWidth=i===S.me?2:1.5;ctx.stroke();

      ctx.fillStyle="#f0e6d6";ctx.font="bold 10px "+FONT;ctx.textAlign="center";
      var label=pName(i)+(p[4]?" · À TERRE":"  "+Math.ceil(p[2])+"/"+p[3]);
      ctx.fillText(label,x+77,y+12);
    });

    ctx.fillStyle="#e5a93c";ctx.font="bold 22px "+SERIF;ctx.textAlign="center";
    ctx.fillText("VAGUE "+S.wv+" / "+(S.mw||50),W/2,32);
    ctx.fillStyle="#cbbba6";ctx.font="bold 11.5px "+FONT;
    var sub=S.rem>0?("Restants : "+S.rem+"  |  Niv. "+S.l):("Vague nettoyée  |  Niv. "+S.l);
    ctx.fillText(sub,W/2,49);

    if(S.bn){
      var bw=340,bx=(W-bw)/2,by=64;
      rr(bx,by,bw,16,4);ctx.fillStyle="#161310";ctx.fill();
      if(S.bh>0){
        rr(bx+2,by+2,Math.max(4,(bw-4)*S.bh/100),12,2);
        ctx.fillStyle="#d94e4e";ctx.fill();
      }
      rr(bx,by,bw,16,4);ctx.strokeStyle="#e5a93c";ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle="#f0e6d6";ctx.font="bold 9.5px "+FONT;ctx.textAlign="center";
      ctx.fillText(S.bn.toUpperCase()+" — "+S.bh+"%",W/2,by+12);
    }else if(S.flk){
      ctx.textAlign="center";ctx.font="bold 11.5px "+FONT;
      ctx.fillStyle="#ffd166";ctx.fillText("✦ LIEN TOTAL ACTIF (DÉGÂTS ×1,65 · CAD. ×1,6 · +3 PV/S) ✦",W/2,66);
    }else if(me&&me[15]){
      ctx.textAlign="center";ctx.font="bold 11.5px "+FONT;
      ctx.fillStyle="#e5a93c";ctx.fillText("LIEN DE GARDE ACTIF",W/2,66);
    }

    ctx.textAlign="right";ctx.fillStyle="rgba(240,230,214,.4)";ctx.font="10.5px "+FONT;
    ctx.fillText("SALLE "+S.code+" · "+fmt(S.tm),W-14,H-42);

    if(S.pz&&!S.mpz){
      ctx.fillStyle="rgba(10,8,6,.74)";
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#e5a93c";ctx.font="bold 26px "+SERIF;ctx.textAlign="center";
      ctx.fillText("PAUSE — NIVEAU "+S.l,W/2,H/2-74);
      ctx.fillStyle="#f0e6d6";ctx.font="bold 14px "+FONT;
      var who=(S.ch&&S.ch.length)
        ?"Choisis ton amélioration (1/& , 2/é , 3/\")"
        :"Tu as choisi ! En attente de l'escouade…";
      ctx.fillText(who,W/2,H/2-46);
    }
  }
}

function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(!(S&&S.pz)){
    shake=Math.max(0,shake-dt*32);
    for(var k in flashE){flashE[k]-=dt;if(flashE[k]<=0)delete flashE[k]}
    PA.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});
    PA=PA.filter(function(p){return p.l>0});
    RINGS.forEach(function(rg){rg.r+=(rg.rm-rg.r)*Math.min(1,dt*10);rg.l-=dt});
    RINGS=RINGS.filter(function(rg){return rg.l>0});
    FLOATS.forEach(function(fl){fl.y-=22*dt;fl.l-=dt});
    FLOATS=FLOATS.filter(function(fl){return fl.l>0});
    GHOSTS.forEach(function(gh){gh.l-=dt});
    GHOSTS=GHOSTS.filter(function(gh){return gh.l>0});
  }
  if(S)S.p.forEach(function(p,i){
    if(!vis[i])vis[i]={x:p[0],y:p[1],vx:0,vy:0,recoil:0,flash:0,sc:p[13],dsh:0};
    var v=vis[i];
    v.vx=(p[0]-v.x)*.5;
    v.vy=(p[1]-v.y)*.5;
    v.x+=v.vx;
    v.y+=v.vy;
    v.recoil=Math.max(0,(v.recoil||0)-dt*8);
    v.flash=Math.max(0,(v.flash||0)-dt*14);

    if(p[13]!==v.sc){
      v.sc=p[13];
      v.recoil=1;
      v.flash=1;
    }
    if(p[12]&&!v.dsh){
      addRing(v.x,v.y,34,CO[i%6],2.5);
      burst(v.x,v.y,"#cbbba6",6,false);
    }
    v.dsh=p[12];
    if(p[12]&&!(S&&S.pz)){
      GHOSTS.push({x:v.x,y:v.y,c:CO[i%6],l:.22});
    }

    var T=TR[i];
    if(S.st==="play"&&!p[4]&&!S.pz){T.push({x:v.x,y:v.y});if(T.length>14)T.shift()}
    else if(p[4])T.length=0;
  });
  draw();
  requestAnimationFrame(frame);
}
document.getElementById("dash").addEventListener("pointerdown",function(e){e.preventDefault();send({t:"dash"})});
if(room)connect();else lobby();
requestAnimationFrame(function(n){last=n;frame(n)});
})();
</script>
